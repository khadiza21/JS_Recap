<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Confirmation Button</title>
</head>
<body>
    <h1>Explore More events</h1>
    <button id="btn">Events</button>
    <input type="text" id="textField">

    <script>
        document.getElementById('textField').addEventListener('focus', function(){
            console.log('Event trigged inside the input filed - focus')
        })
        document.getElementById('textField').addEventListener('blur', function(){
            console.log('Event trigged inside the input filed - blur')
        })
        document.getElementById('textField').addEventListener('mousemove', function(){
            console.log('Event trigged inside the input filed - mousemove')
        })
        // document.getElementById('textField').addEventListener('keyup', function(event){
        //     console.log(event.target.value);
        // })
        document.getElementById('textField').addEventListener('keypress', function(event){
            console.log(event.target.value);
        })
        // document.getElementById('textField').addEventListener('keydown', function(event){
        //     console.log(event.target.value);
        // })
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Button</title>
  </head>
  <body>
    <h1 id="secretText">My secret info</h1>
    <input type="text" placeholder="Please type 'delete'" id="deleteConfirm" />
    <button id="deleteBtn" disabled>Delete</button>

    <script>
      document
        .getElementById("deleteConfirm")
        .addEventListener("keyup", function (event) {
          const token = event.target.value;
          if (token === "delete") {
            document.getElementById('deleteBtn').removeAttribute("disabled");
          } else {
            document.getElementById('deleteBtn').setAttribute('disabled', true );
          }
        });

      document
        .getElementById("deleteBtn")
        .addEventListener("click", function () {
          const secretText = (document.getElementById(
            "secretText"
          ).style.display = "none");
        });
    </script>
  </body>
</html>
